variables:
  REGION: asia-southeast1
  IMAGE_NAME: ktn-jobs
  APP_NAME_JOBS: ktn-jobs
  APP_NAME_NFT_QUEUE: ktn-jobs-nft-queue
  APP_NAME_SCHEDULES: ktn-jobs-schedules-price
  APP_NAME_WORKER: ktn-jobs-worker
  APP_NAME_SCAN_STAKE_NFT: ktn-jobs-scan-stake-nft
  APP_NAME_SCHEDULE_STAKING: ktn-jobs-schedule-staking
  APP_NAME_JOBS_REFERRAL: ktn-jobs-referral-commission-worker
  APP_NAME_SCHEDULE_CRON_UNSTAKEALL: ktn-jobs-schedules-cron-unstakeall
  APP_NAME_SCHEDULE_CRON_WITHDRAW: ktn-jobs-schedules-cron-withdraw
  APP_NAME_SCHEDULE_CRON_COINGECKO: ktn-jobs-schedules-coingecko

  APP_NAME_STAKING_QUEUE: ktn-jobs-staking-queue
  APP_NAME_QUEUE_WORKER:  ktn-jobs-queue-worker
  APP_NAME_WITHDRAW_ROYALTY_WORKER: ktn-jobs-withdraw-royalty-worker
  APP_NAME_UPDATE_BALANCE_ROYALTY_WORKER: ktn-jobs-update-balance-royalty-worker
  APP_NAME_GET_INFO_ROYALTY_WORKER: ktn-jobs-get-info-royalty-worker
  CONTAINER_REPO_ASIA_STAG: 968557029040.dkr.ecr.ap-southeast-1.amazonaws.com/stag/ktn-jobs
  ONTAINER_REPO_ASIA_PROD: harbor.atomsolution.vn/ktn/ktn-jobs
  NAMESPACE_STAG: ktn-jobs-stag
  FULLREPO_ASIA_STAG: $CONTAINER_REPO_ASIA_STAG:$CI_COMMIT_SHA
  FULLREPO_ASIA_PROD: $CONTAINER_REPO_ASIA_PROD:$CI_COMMIT_SHORT_SHA
  HELM_VALUE: ${CI_COMMIT_REF_NAME}
  HELM_VERSION: 3.0.1
  KUBECTL_VERSION: v1.22.0
  SKAFFOLD_VERSION: v1.38.0
  HELM_CRONJOB_VERSION: 0.1.9

  AWS_REGION: ap-southeast-1
  GITLAB_TOKEN: $GITLAB_RUNNER_TOKEN
  DOCKER_DRIVER: overlay
 # DOCKER_HOST: tcp://localhost:2375
  DOCKER_TLS_CERTDIR: ""
  GIT_SUBMODULE_STRATEGY: recursive
  PROD_SERVER_1_IP: 3.66.46.121
  PROD_SERVER_USER: root

stages:
  - build
  - deploy

.kubectl_config: &kubectl_config
  - |
      if [ "$CI_COMMIT_REF_NAME" == "master" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-production-cluster
      fi
  - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        aws eks --region $AWS_REGION update-kubeconfig --name esol-staging-cluster
      fi
.predeploy: &predeploy |
  apk add --no-cache  bash git  python3 py3-pip curl
  pip3 install --upgrade pip 
  pip3 install --no-cache-dir awscli
  helm plugin install https://github.com/hypnoglow/helm-s3.git --version 0.12.0
  helm repo add helm-template s3://esol-helm-template
  helm pull s3://esol-helm-template/helm-template-$HELM_VERSION.tgz --untar=true
  
build_stag:
  image: docker:19.03.1
  tags:
  - esol-stag-test
  stage: build
  services:
  - docker:19.03.1-dind
  before_script:
    - apk add --no-cache curl jq python py-pip wget git bash
    - pip install awscli 
    - git submodule add -f --branch stag https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/katana/ktn-lib.git lib
    - export VERIFY_CHECKSUM=false && curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 && chmod +x ./get_helm.sh && ./get_helm.sh
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/$SKAFFOLD_VERSION/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin
    - git submodule sync --recursive
    - git submodule update --init --remote --recursive
  script:
    - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_REGION) $CONTAINER_REPO_ASIA_STAG
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE_STAG#g" skaffold.yaml
        sed -i -e "s#\[CONTAINER_REPO\]#$CONTAINER_REPO_ASIA_STAG#g" skaffold.yaml
        sed -i -e "s#\[APP_NAME\]#$IMAGE_NAME#g" skaffold.yaml
        sed -i -e "s#\[CI_COMMIT_REF_NAME\]#$CI_COMMIT_REF_NAME#g" skaffold.yaml
        cat skaffold.yaml
      fi
    - /usr/local/bin/skaffold build -p profile-stag --file-output=build_sync.json
  only:
    refs:
      - stag
   
  artifacts:
    paths:
    - build_sync.json

build:
  stage: build
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  tags:
    - esol-stag-test
  before_script:
    - apk add --no-cache curl jq python py-pip wget git bash
    - git submodule sync --recursive
    - git submodule update --init --remote --recursive
    - git submodule add -f --branch stag https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/katana/ktn-lib.git lib
  script:
    - cp $PROD_ENV .env
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker build -t $FULLREPO_ASIA_PROD . -f Dockerfile
    - docker image push $FULLREPO_ASIA_PROD

  only:
    - master

deploy-prod-server1:
  stage: deploy
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  tags:
    - esol-stag
  before_script:
    - apk add openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PROD_SERVER_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -H $PROD_SERVER_1_IP >> ~/.ssh/known_hosts
  script:
    - sed -i -e "s#\[IMAGE_REPO\]#$FULLREPO_ASIA_PROD#g" docker-compose.yml 
    - scp docker-compose.yml  root@${PROD_SERVER_1_IP}:/data/cicd/ktn-jobs/docker-compose.yml 
    - ssh root@$PROD_SERVER_1_IP "docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}"
    - ssh root@$PROD_SERVER_1_IP "cd /data/cicd/ktn-jobs/ && docker-compose up --build -d"
  only:
    - master

deploy_stag:
  stage: deploy
  image:  alpine/helm:3.2.1
  tags:
  - esol-stag
  script:
    - *predeploy
    - *kubectl_config
    - |
      if [ "$CI_COMMIT_REF_NAME" == "stag" ]; then
        sed -i -e "s#\[NAMESPACE\]#$NAMESPACE_STAG#g" skaffold.yaml
        sed -i -e "s#\[APP_NAME\]#$APP_NAME_JOBS#g" skaffold.yaml
        sed -i -e "s#\[CONTAINER_REPO\]#$CONTAINER_REPO_ASIA_STAG#g" skaffold.yaml
        sed -i -e "s#\[CI_COMMIT_REF_NAME\]#$CI_COMMIT_REF_NAME#g" skaffold.yaml
      fi
    - git clone https://read-token:$GITLAB_TOKEN@gitlab.rinznetwork.com/rinz-io-devops/helm-value/katana/$IMAGE_NAME.git
    - mv $IMAGE_NAME/${APP_NAME_JOBS}-stag.yaml .
    - curl -LO https://storage.googleapis.com/kubernetes-release/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl && chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/$SKAFFOLD_VERSION/skaffold-linux-amd64 && chmod +x skaffold &&  mv skaffold /usr/local/bin
    - /usr/local/bin/skaffold deploy -p profile-${APP_NAME_JOBS}-stag   -a build_sync.json

  only:
    refs:
      - stag

